$schema: "http://json-schema.org/draft-07/schema#"
title: RunManifest
description: Schema for engine run manifest (records what data/code produced a result)
type: object
properties:
  run_id:
    type: string
    description: Unique identifier for this run
  timestamp:
    type: string
    format: date-time
  engine_version:
    type: string
  data_sources:
    type: array
    items:
      type: object
      properties:
        path:
          type: string
        sha256:
          type: string
        rows:
          type: integer
        date_range:
          type: object
          properties:
            start:
              type: string
            end:
              type: string
  parameters:
    type: object
    description: Key-value parameter snapshot
