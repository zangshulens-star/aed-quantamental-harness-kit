# =============================================================================
# Quant Harness — Claims Registry Template
# =============================================================================
# Register every quantitative claim from your paper here.
# Each claim is verified by qh-verify against actual data or engine output.
#
# Claim types:
#   value_exact   — Compare latest value against expected, with tolerance
#   value_range   — Check value falls within [min, max]
#   aggregate     — Compare sum/mean/max/min/count against expected
#   time_mask     — Verify condition holds during a time period
#   cross_count   — Count rows matching a cross-section condition
#   set_equality  — Compare sets of unique values
#
# Resolution methods:
#   from_csv              — Read from CSV, apply filter, extract column
#   recompute_from_engine — Run engine function via importlib
#   custom_python         — Run external script via subprocess
# =============================================================================

meta:
  project_name: "My Project"
  project_root: "."
